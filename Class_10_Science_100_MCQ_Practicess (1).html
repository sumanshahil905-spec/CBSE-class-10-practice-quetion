<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Science - 100 MCQ Practice</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
color:#172033;
min-height:100vh;
background:
radial-gradient(circle at 10% 15%, rgba(255,255,255,.95) 0 7%, transparent 25%),
radial-gradient(circle at 90% 10%, rgba(191,219,254,.75) 0 8%, transparent 28%),
radial-gradient(circle at 80% 90%, rgba(221,214,254,.75) 0 10%, transparent 30%),
linear-gradient(135deg,#dbeafe 0%,#eef2ff 45%,#f8fafc 100%);
background-attachment:fixed;
}
.container{max-width:900px;margin:30px auto;padding:20px}
header{background:#0f4c81;color:white;border-radius:18px;padding:25px;text-align:center;box-shadow:0 8px 25px #0002}
header h1{margin:0 0 8px;font-size:30px}
header p{margin:0;font-size:16px}.mark{display:inline-block;background:#fff3cd;color:#7a5300;padding:5px 9px;border-radius:8px;font-size:13px;margin-left:6px}.review-q{padding:16px;margin:12px 0;border:1px solid #d7dee8;border-radius:12px}.review-q.correct-box{border-left:6px solid #16a34a}.review-q.wrong-box{border-left:6px solid #dc2626}.review-q.unanswered-box{border-left:6px solid #64748b}.review-opt{padding:8px 10px;margin:5px 0;border-radius:8px}.review-opt.correct-opt{background:#b9f6c3}.review-opt.wrong-opt{background:#ffc2c2}
.topbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:18px 0}
.badge{background:white;padding:12px 18px;border-radius:12px;box-shadow:0 3px 12px #0001;font-weight:bold}
.card{background:white;border-radius:18px;padding:25px;box-shadow:0 8px 25px #0001}
.chapter{color:#0f4c81;font-weight:bold;margin-bottom:10px}
.question{font-size:21px;font-weight:bold;line-height:1.45;margin:12px 0 20px}
.option{width:100%;border:2px solid #d7dee8;background:#fff;padding:14px 16px;margin:9px 0;border-radius:12px;text-align:left;font-size:16px;cursor:pointer;transition:.2s}
.option:hover:not(.locked){background:#eef7ff;border-color:#5aa9e6}
.option.correct{background:#b9f6c3;border-color:#16a34a;color:#075b24}
.option.wrong{background:#ffc2c2;border-color:#dc2626;color:#8b1010}
.option.locked{cursor:not-allowed}
.explanation{margin-top:15px;padding:12px;border-radius:10px;background:#f1f5f9;display:none}
button.nav{margin-top:20px;border:0;border-radius:12px;padding:13px 24px;background:#0f4c81;color:#fff;font-size:16px;cursor:pointer}
button.nav:disabled{opacity:.45;cursor:not-allowed}
#result{text-align:center;display:none}
.score{font-size:42px;font-weight:bold;color:#0f4c81}
.restart{background:#16a34a!important}
select{padding:10px;border-radius:10px;border:1px solid #ccd5df}
@media(max-width:600px){header h1{font-size:23px}.question{font-size:18px}.container{padding:10px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📚 Class 10 Science MCQ Practice</h1>
<p>NCERT-based practice • 100 Objective Questions</p>
</header>

<div class="topbar">
<div class="badge">Question: <span id="qno">1</span>/100</div>
<div class="badge">Score: <span id="score">0</span></div>
<div class="badge">Answered: <span id="answered">0</span>/100</div>
</div>

<div class="card" id="quizCard">
<div class="chapter" id="chapter"></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div class="explanation" id="explanation"></div>
<button class="nav" id="nextBtn" onclick="nextQuestion()" disabled>Next Question →</button>
<button class="nav" id="submitBtn" onclick="submitPaper()" style="margin-left:8px;background:#16a34a;">Submit Paper ✓</button>
</div>

<div class="card" id="result">
<h2>🎉 Result</h2>
<div class="score" id="finalScore"></div>
<p id="resultText"></p>
<p><b>Total Marks:</b> 200 &nbsp; | &nbsp; <b>Marks Obtained:</b> <span id="marksObtained">0</span>/200</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px">
<button class="nav" onclick="showPaper()">📄 Show Paper</button>
<button class="nav" onclick="showWrong()">❌ Wrong Answers</button>
<button class="nav restart" onclick="restartQuiz()">🔄 Practice Again</button>
</div>
</div>

<div class="card" id="paper" style="display:none;margin-top:18px">
<h2>📄 Complete Paper Review</h2>
<p>🟢 Correct answer &nbsp;&nbsp; 🔴 Wrong answer &nbsp;&nbsp; ⚪ Not answered</p>
<div id="paperContent"></div>
</div>

<div class="card" id="wrong" style="display:none;margin-top:18px">
<h2>❌ Wrong Answers</h2>
<div id="wrongContent"></div>
</div>
</div>

let current=0, score=0, answered=0, locked=false, submitted=false;
const selectedAnswers = Array(questions.length).fill(null);

function render(){
  const x=questions[current];
  document.getElementById("qno").textContent=current+1;
  document.getElementById("chapter").innerHTML="📖 "+x.c+' <span class="mark">2 Marks</span>';
  document.getElementById("question").textContent=(current+1)+". "+x.q;
  const box=document.getElementById("options");
  box.innerHTML="";
  x.o.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.textContent=String.fromCharCode(65+i)+". "+opt;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
  document.getElementById("explanation").style.display="none";
  document.getElementById("nextBtn").disabled=true;
  locked=selectedAnswers[current]!==null;
  if(locked) restoreSelection();
}

function restoreSelection(){
  const selected=selectedAnswers[current];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.classList.add("locked"));
  if(selected===questions[current].a){
    buttons[selected].classList.add("correct");
    document.getElementById("explanation").innerHTML="🟢 Correct Answer!";
  }else{
    buttons[selected].classList.add("wrong");
    buttons[questions[current].a].classList.add("correct");
    document.getElementById("explanation").innerHTML="🔴 Wrong Answer. The correct answer is <b>"+questions[current].o[questions[current].a]+"</b>.";
  }
  document.getElementById("explanation").style.display="block";
  document.getElementById("nextBtn").disabled=false;
}

function choose(i,btn){
  if(locked || submitted)return;
  locked=true;
  selectedAnswers[current]=i;
  answered++;
  document.getElementById("answered").textContent=answered;
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.classList.add("locked"));
  if(i===questions[current].a){
    btn.classList.add("correct");
    score++;
    document.getElementById("score").textContent=score;
    document.getElementById("explanation").innerHTML="🟢 Correct Answer! <b>+2 Marks</b>";
  }else{
    btn.classList.add("wrong");
    buttons[questions[current].a].classList.add("correct");
    document.getElementById("explanation").innerHTML="🔴 Wrong Answer. The correct answer is <b>"+questions[current].o[questions[current].a]+"</b>.";
  }
  document.getElementById("explanation").style.display="block";
  document.getElementById("nextBtn").disabled=false;
}

function nextQuestion(){
  if(!locked || submitted)return;
  current++;
  if(current>=questions.length){current=questions.length-1;return;}
  render();
}

function submitPaper(){
  if(submitted)return;
  if(answered<questions.length){
    const ok=confirm("Aapne "+(questions.length-answered)+" questions attempt nahi kiye hain. Kya paper submit karna hai?");
    if(!ok)return;
  }
  submitted=true;
  document.getElementById("quizCard").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("marksObtained").textContent=(score*2);
  document.getElementById("finalScore").textContent=(score*2)+" / 200";
  const p=(score/questions.length)*100;
  document.getElementById("resultText").textContent="Correct Answers: "+score+" / 100 | Wrong Answers: "+(answered-score)+" | Not Attempted: "+(questions.length-answered)+" | Percentage: "+p.toFixed(1)+"%";
  document.getElementById("paper").style.display="none";
  document.getElementById("wrong").style.display="none";
}

function showPaper(){
  if(!submitted)return;
  document.getElementById("wrong").style.display="none";
  const wrap=document.getElementById("paperContent");
  wrap.innerHTML="";
  questions.forEach((x,idx)=>{
    const sel=selectedAnswers[idx];
    const box=document.createElement("div");
    box.className="review-q "+(sel===null?"unanswered-box":sel===x.a?"correct-box":"wrong-box");
    let s="<b>"+(idx+1)+". "+x.q+"</b> <span class='mark'>2 Marks</span>";
    x.o.forEach((opt,j)=>{
      let cls="review-opt";
      if(j===x.a) cls+=" correct-opt";
      else if(j===sel && sel!==x.a) cls+=" wrong-opt";
      s+="<div class='"+cls+"'>"+String.fromCharCode(65+j)+". "+opt+(j===x.a?" &nbsp; 🟢 Correct Answer":"")+(j===sel && sel!==x.a?" &nbsp; 🔴 Your Answer":"")+"</div>";
    });
    if(sel===null)s+="<div>⚪ Not Attempted</div>";
    box.innerHTML=s;
    wrap.appendChild(box);
  });
  document.getElementById("paper").style.display="block";
}

function showWrong(){
  if(!submitted)return;
  document.getElementById("paper").style.display="none";
  const wrap=document.getElementById("wrongContent");
  wrap.innerHTML="";
  let count=0;
  questions.forEach((x,idx)=>{
    const sel=selectedAnswers[idx];
    if(sel!==null && sel!==x.a){
      count++;
      const box=document.createElement("div");
      box.className="review-q wrong-box";
      box.innerHTML="<b>"+(idx+1)+". "+x.q+"</b><div class='review-opt wrong-opt'>🔴 Your Answer: "+x.o[sel]+"</div><div class='review-opt correct-opt'>🟢 Correct Answer: "+x.o[x.a]+"</div>";
      wrap.appendChild(box);
    }
  });
  if(count===0) wrap.innerHTML="<h3 style='text-align:center;color:#15803d'>🎉 No wrong answers!</h3>";
  document.getElementById("wrong").style.display="block";
}

function restartQuiz(){
  current=0;score=0;answered=0;locked=false;submitted=false;
  selectedAnswers.fill(null);
  document.getElementById("score").textContent=0;
  document.getElementById("answered").textContent=0;
  document.getElementById("result").style.display="none";
  document.getElementById("paper").style.display="none";
  document.getElementById("wrong").style.display="none";
  document.getElementById("quizCard").style.display="block";
  render();
}

render();
</script>
</body>
